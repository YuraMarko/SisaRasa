<!doctype html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SisaRasa</title>
  <link rel="stylesheet" href="style.css">

<body>
  <header>
    <span class="logo">SisaRasa</span>
  </header>

  <main>
    <h1>Selamatkan buah, jadikan selai</h1>

    <section class="intro">
      <p>

        berapa kilogram buah yang terselamatkan.
      </p>
      <div class="hero" id="hero"></div>
    </section>

    <section class="grid" id="grid"></section>

    <p class="foot">Tampilan rancangan (mockup).</p>
